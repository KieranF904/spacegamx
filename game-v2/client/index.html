<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Game v2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #cfd5ff;
      z-index: 10;
    }
    
    .ui-element {
      pointer-events: auto;
    }

    /* ============================================
       XP HUD - Bottom Center
       ============================================ */
    #xpHud {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 25;
      pointer-events: none;
    }

    #xpLevel {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
    }

    #xpBar {
      position: relative;
      width: 260px;
      height: 14px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    /* XP coming in: the bar glows; a new level: it flares gold and the level number pops */
    #xpBar.gain { animation: xpGain 0.6s ease-out; }
    #xpBar.lvl { animation: xpLvl 1.4s ease-out; }
    #xpLevel.lvl { animation: lvlPop 0.9s cubic-bezier(0.2, 1.6, 0.4, 1); color: #ffd166; }
    @keyframes xpGain { 0% { box-shadow: 0 0 18px rgba(120, 200, 255, 0.95); border-color: #d8f0ff; } }
    @keyframes xpLvl { 0%, 30% { box-shadow: 0 0 30px rgba(255, 209, 102, 1); border-color: #ffd166; } }
    @keyframes lvlPop { 0% { transform: scale(1); } 30% { transform: scale(1.45); } 100% { transform: scale(1); } }
    #xpLevel { display: inline-block; transition: color 1s; }
    @media (prefers-reduced-motion: reduce) { #xpBar.gain, #xpBar.lvl, #xpLevel.lvl { animation: none; } }

    #xpFill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(120, 200, 255, 0.95);
      transition: width 0.15s ease-out;
    }

    #xpTicks {
      position: absolute;
      inset: 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .xp-tick {
      width: 2px;
      height: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 2px;
    }

    #xpNumber {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      margin-left: 8px;
      min-width: 50px;
    }

    /* Inventory/Equipment panels are styled by InventoryUI.ts */

    /* ============================================
       Top HUD - System Info & Credits
       ============================================ */
    #topHud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: none;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 25;
      pointer-events: none;
    }

    #systemInfo {
      font-size: 14px;
      letter-spacing: 0.05em;
      color: rgba(200, 220, 255, 0.9);
      text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
    }

    #creditsDisplay {
      font-size: 14px;
      letter-spacing: 0.05em;
      color: rgba(255, 220, 100, 0.95);
      text-shadow: 0 0 10px rgba(255, 200, 50, 0.4);
    }

    /* ============================================
       Minimap - Bottom Right
       ============================================ */
    /* ============================================
       Loading & Debug
       ============================================ */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #88ccff;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.6);
    }

    /* The performance monitor builds its own panel (ui/PerfMonitor.ts) */

    /* ============================================
       Quest Tracker - Top Right
       ============================================ */
    #questTracker {
      position: absolute;
      top: 60px;
      right: 16px;
      width: 220px;
      background: rgba(6, 10, 24, 0.75);
      border: 1px solid rgba(120, 160, 220, 0.25);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      display: none;
      z-index: 20;
    }

    #questTracker h3 {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(200, 220, 255, 0.8);
      margin-bottom: 8px;
    }

    /* ============================================
       Chat Box - Bottom Left
       ============================================ */
    #chatBox {
      position: absolute;
      bottom: 20px;
      left: 16px;
      width: 320px;
      z-index: 30;
      pointer-events: auto;
    }

    #chatTabs {
      display: flex;
      gap: 2px;
      padding: 0 6px;
    }

    #chatTabs button {
      padding: 3px 8px;
      background: rgba(6, 10, 24, 0.55);
      border: 1px solid rgba(120, 160, 220, 0.25);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: rgba(220, 230, 255, 0.6);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    #chatTabs button:hover {
      color: rgba(220, 230, 255, 0.9);
    }

    #chatTabs #chatHideBtn {
      margin-left: auto;
    }

    /* Hidden chat: only this stays, and it's invisible until the mouse is over it (so videos don't show it) */
    #chatShowBtn {
      position: absolute;
      left: 6px;
      bottom: 0;
      padding: 3px 10px;
      background: rgba(6, 10, 24, 0.7);
      border: 1px solid rgba(120, 160, 220, 0.25);
      border-radius: 6px;
      color: rgba(220, 230, 255, 0.8);
      font-size: 11px;
      cursor: pointer;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s;
    }

    #chatBox.chat-hidden #chatShowBtn {
      visibility: visible;
    }

    #chatBox.chat-hidden #chatShowBtn:hover,
    #chatBox.chat-hidden #chatShowBtn:focus-visible {
      opacity: 1;
    }

    #chatTabs button.active {
      background: rgba(6, 10, 24, 0.7);
      color: rgba(120, 200, 255, 0.95);
    }

    #chatMessages {
      max-height: 180px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(6, 10, 24, 0.7);
      border: 1px solid rgba(120, 160, 220, 0.25);
      border-radius: 6px 10px 0 0;
      font-size: 12px;
      line-height: 1.5;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 150, 255, 0.3) transparent;
    }

    #chatMessages::-webkit-scrollbar {
      width: 6px;
    }

    #chatMessages::-webkit-scrollbar-thumb {
      background: rgba(100, 150, 255, 0.3);
      border-radius: 3px;
    }

    .chat-message {
      margin-bottom: 4px;
      word-wrap: break-word;
    }

    .chat-message .player-name {
      color: rgba(120, 200, 255, 0.95);
      font-weight: 600;
    }

    .chat-message .message-text {
      color: rgba(220, 230, 255, 0.9);
    }

    .chat-message.system {
      color: rgba(255, 200, 100, 0.9);
      font-style: italic;
    }

    /* Private messages: cyan, the name clickable to reply */
    .chat-message.private .player-name,
    .chat-message.private .message-text {
      color: #5ee7f7;
    }

    .chat-message.private .player-name {
      cursor: pointer;
    }

    .chat-message.private .player-name:hover {
      text-decoration: underline;
    }

    #chatTabs .chat-friends {
      margin-left: auto;
      color: rgba(94, 231, 247, 0.85);
    }

    #chatTabs .chat-friends + #chatHideBtn {
      margin-left: 0;
    }

    /* "Reply to <name>:" before the input while writing a private message */
    #chatPrefix {
      display: flex;
      align-items: center;
      padding: 0 4px 0 12px;
      background: rgba(10, 16, 36, 0.95);
      border: 1px solid rgba(94, 231, 247, 0.45);
      border-top: none;
      border-right: none;
      border-radius: 0 0 0 10px;
      color: #5ee7f7;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #chatInput {
      min-width: 0;
    }

    #chatPrefix[hidden] {
      display: none;
    }

    #chatPrefix:not([hidden]) + #chatInput {
      border-radius: 0;
      border-left: none;
      border-color: rgba(94, 231, 247, 0.45);
      color: #c9f7fd;
    }

    #chatInputContainer {
      display: flex;
      gap: 0;
    }

    #chatInput {
      flex: 1;
      padding: 10px 12px;
      background: rgba(6, 10, 24, 0.85);
      border: 1px solid rgba(120, 160, 220, 0.3);
      border-top: none;
      border-radius: 0 0 0 10px;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }

    #chatInput:focus {
      background: rgba(10, 16, 36, 0.95);
      border-color: rgba(120, 160, 220, 0.5);
    }

    #chatInput::placeholder {
      color: rgba(150, 170, 200, 0.5);
    }

    #chatSendBtn {
      padding: 10px 16px;
      background: rgba(60, 100, 180, 0.7);
      border: 1px solid rgba(120, 160, 220, 0.3);
      border-top: none;
      border-left: none;
      border-radius: 0 0 10px 0;
      color: rgba(200, 220, 255, 0.95);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #chatSendBtn:hover {
      background: rgba(80, 130, 220, 0.8);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <div id="loading">Connecting...</div>
      
      <!-- Top HUD: System name & Credits -->
      <div id="topHud">
        <div id="systemInfo">Sol System</div>
        <div id="creditsDisplay">💰 <span id="credits">0</span></div>
      </div>

      <!-- XP Bar -->
      <div id="xpHud">
        <span id="xpLevel">LVL <span id="level">1</span></span>
        <div id="xpBar">
          <div id="xpFill"></div>
          <div id="xpTicks">
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
            <div class="xp-tick"></div>
          </div>
        </div>
        <span id="xpNumber"><span id="xp">0</span>/<span id="xpToNext">100</span></span>
      </div>

      <!-- Inventory and Equipment Panels are created dynamically by InventoryUI.ts -->

      <!-- (The power readout, bottom right, is ui/hud/PowerMargin.ts) -->

      <!-- Quest Tracker -->
      <div id="questTracker">
        <h3>Active Quests</h3>
        <div id="questList"></div>
      </div>

      <!-- Chat Box -->
      <div id="chatBox" class="ui-element">
        <div id="chatTabs">
          <!-- The channel toggles (All, Public, Private, Game) and Friends go here: ui/ChatPanel.ts -->
          <button type="button" id="chatHideBtn" title="Hide the chat (Settings > Chat box; Enter brings it back)">Hide</button>
        </div>
        <button type="button" id="chatShowBtn" title="Show the chat">Show chat</button>
        <div id="chatMessages"></div>
        <div id="chatInputContainer">
          <input type="text" id="chatInput" placeholder="Press Enter to chat..." maxlength="200" autocomplete="off">
          <button id="chatSendBtn">Send</button>
        </div>
      </div>

      <!-- Inventory Modal Container (for detailed inventory UI) -->
      <div id="inventory-container"></div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
