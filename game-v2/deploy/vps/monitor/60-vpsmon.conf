# The resource monitor's account (game-v2/deploy/vps/monitor): its key only, and all it can ever do is stream the
# box's stats (vpsmon-stream). No password, no shell, no terminal, no forwarding of any kind, whatever it asks for.
Match User vpsmon
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/bin/vpsmon-stream
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 2
