# The game's routes, inside the space.brotherk3d.com server block (sites-available/spacegame includes this file).
# Installed as /etc/nginx/snippets/spacegame-game.conf by remote-install.sh on every deploy (nothing certbot edits is
# here), tested with nginx -t and put back as it was if that fails.
#
# The root (/) is a second snippet, /etc/nginx/snippets/spacegame-root.conf, included at the end:
#   nginx-spacegame-play.conf  the game alone (the default deploy): the client at / and /play, its socket at the root
#   nginx-spacegame-site.conf  with the website (WITH_SITE=1, or the website already running): the site at /, the game
#                              at /play (served by the site), its socket still at the root

root /opt/spacegame/client/dist;
index index.html;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Lobby: only the server list is public (servers register over localhost)
location = /lobby/list {
    proxy_pass http://127.0.0.1:8790/list;
    proxy_set_header Host $host;
}
# Accounts (sign in, register, check a session): the lobby keeps them for every server.
# The client's address is set here, not passed on, so it can't be faked to dodge the attempt limit.
location /lobby/auth/ {
    proxy_pass http://127.0.0.1:8790/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Game server health check (the join screen's ping)
location = /health {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
}

# Vite's hashed bundles: a new build has new names, so these never change
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Sounds keep their names between builds: the browser keeps them, but asks each time whether they changed
location /sfx/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Source maps are built for local debugging only (vite sourcemap: 'hidden'); never served
location ~ \.map$ {
    return 404;
}

# The game's WebSocket (the client opens it at the site root): the root snippet's "location /" sends upgrades here
location @spacegame_ws {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # (set, not passed on: the game server takes X-Real-IP from nginx only, for its per-address limits)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The root: the game alone, or the website (see above)
include /etc/nginx/snippets/spacegame-root.conf;
