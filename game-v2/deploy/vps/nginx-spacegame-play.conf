# The root for a game-only install (the default deploy: no website). Installed as
# /etc/nginx/snippets/spacegame-root.conf by remote-install.sh when the website is neither shipped nor running; it is
# included at the end of spacegame-game.conf, which has the lobby, /health, /assets/, /sfx/ and the socket's
# @spacegame_ws.

# The page itself: always asked again, so a deploy's new bundle names are picked up
# Content-Security-Policy (SEC-16), on the game's page only: the website at / is a different app with its own needs, and
# the header is repeated here because a location that sets its own add_header drops the server-level ones.
# It is REPORT-ONLY for now: a browser logs what it would have blocked to its console ("[Report Only] Refused to ...")
# and blocks nothing. Once a session on the dev server and one on the live server show no such lines, rename the header to
# Content-Security-Policy to enforce it. What each part is for:
#   script-src 'self'             the bundle and its code-split chunks (no inline scripts; Pixi's code-built shaders are
#                                 swapped for pixi.js/unsafe-eval in client/src/main.ts, so there is no 'unsafe-eval')
#   style-src ... 'unsafe-inline' the client builds its panels with <style> tags and style="" attributes
#   font-src 'self'               the login screen's Orbitron and Rajdhani, served from /fonts/ (client/public/fonts)
#   img-src data: blob:           generated icons and the frost overlay's blob image
#   worker-src blob:              the hull, atlas and procedural workers are same-origin module files; blob: is slack
#   connect-src                   this host's lobby, /health and game socket (wss://$host). A game server on ANOTHER host in
#                                 the lobby's list would be refused: add its https:// and wss:// origins here first.
#                                 The join screen's news is read from /api/v1/launcher-news on this host (the website; VITE_SITE_URL
#                                 is unset in the deploy build), so 'self' covers it. If the website is ever on another host, add its
#                                 https:// origin to connect-src here (the endpoint already answers any origin). A game-only install
#                                 has no such route: the screen shows "News unavailable".
location = /index.html {
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' wss://$host https://$host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# The game at /play too (where it lives once the website has the root), so either address works
location = /play {
    rewrite ^ /index.html last;
}
location = /play/ {
    rewrite ^ /index.html last;
}

location / {
    # The game's socket (opened at the root): to @spacegame_ws (only "return" inside the if: nothing else is safe there)
    error_page 418 = @spacegame_ws;
    if ($http_upgrade ~* websocket) {
        return 418;
    }
    # Everything else: the client's files, else the page
    try_files $uri /index.html;
}
