# The website's routes, inside the space.brotherk3d.com server block (included from nginx-spacegame.conf).
# Installed as /etc/nginx/snippets/spacegame-site.conf by remote-install.sh on every deploy (it holds
# nothing certbot edits, so it is simply overwritten). remote-install.sh also, once, swaps the old
# "location /" in the live site file for the include of this file; see "nginx" in site/REVIEW.md.
#
# Everything here is the website (127.0.0.1:8791), except what the game needs at the same address:
#   /lobby/, /health, /auth/ and /assets/ are in the server block itself (above the include);
#   /sfx/ and /sandbox.html are the game's static files;
#   a WebSocket at the root is the game's socket (the client opens it there).

location /sfx/ {
    root /opt/spacegame/client/dist;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /sandbox.html {
    root /opt/spacegame/client/dist;
}

# Live shoutbox (server-sent events): no buffering, and the stream may idle for a long time
location = /shoutbox/stream {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # (set, not passed on, so a visitor can't fake the address the site's rate limits use)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location / {
    # Uploads (images for posts) are up to 8 MB
    client_max_body_size 9m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8791;

    # The game's socket
    if ($http_upgrade ~* websocket) {
        proxy_pass http://spacegame_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
