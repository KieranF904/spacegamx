# The root with the website (WITH_SITE=1, or a deploy finding the website already running). Installed as
# /etc/nginx/snippets/spacegame-root.conf by remote-install.sh; it is included at the end of spacegame-game.conf, which
# has the lobby, /health, /assets/, /sfx/ and the socket's @spacegame_ws.
#
# Everything here is the website (127.0.0.1:8791), which also serves the game's page at /play (GAME_MODE=static),
# except a WebSocket at the root: the game's socket.

# Live shoutbox (server-sent events): no buffering, and the stream may idle for a long time
location = /shoutbox/stream {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # (set, not passed on, so a visitor can't fake the address the site's rate limits use)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location / {
    # The game's socket (opened at the root): to @spacegame_ws (only "return" inside the if: nothing else is safe there)
    error_page 418 = @spacegame_ws;
    if ($http_upgrade ~* websocket) {
        return 418;
    }
    # Uploads (images for posts) are up to 8 MB
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
