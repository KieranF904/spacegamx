# Space Game v2 on space.brotherk3d.com. Its own server block, so the other
# sites on this nginx are untouched. certbot adds the 443/TLS lines.

upstream spacegame_game { server 127.0.0.1:3100; }
upstream spacegame_lobby { server 127.0.0.1:8790; }

server {
    listen 80;
    listen [::]:80;
    server_name space.brotherk3d.com;

    root /opt/spacegame/client/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Lobby: only the server list is public (servers register over localhost)
    location = /lobby/list {
        proxy_pass http://spacegame_lobby/list;
        proxy_set_header Host $host;
    }
    # Accounts (sign in, register, check a session): the lobby keeps them for every server.
    # The client's address is set here, not passed on, so it can't be faked to dodge the attempt limit.
    location /lobby/auth/ {
        proxy_pass http://spacegame_lobby/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Game server HTTP: health check (ping) and accounts
    location = /health {
        proxy_pass http://spacegame_game;
        proxy_set_header Host $host;
    }
    location /auth/ {
        proxy_pass http://spacegame_game;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The client opens its WebSocket at the site root; everything else is the static client
    location / {
        if ($http_upgrade ~* websocket) {
            proxy_pass http://spacegame_game;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        try_files $uri $uri/ /index.html;
    }
}
