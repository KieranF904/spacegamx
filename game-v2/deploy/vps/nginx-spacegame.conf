# Space Game v2 on space.brotherk3d.com: its own server block, so the other sites on this nginx are untouched.
# Installed once as /etc/nginx/sites-available/spacegame (certbot then adds the 443/TLS lines to it, so a deploy never
# overwrites it). It holds only the listen, server name and TLS lines: every route is in the snippet below, which
# remote-install.sh refreshes on every deploy (and tests with nginx -t, putting the old one back if it fails).
# An older site file (routes written in it) is cut down to this shape once by remote-install.sh, the same way.

server {
    listen 80;
    listen [::]:80;
    server_name space.brotherk3d.com;

    include /etc/nginx/snippets/spacegame-game.conf;
}
