# The netcode lab under the game's site (space.brotherk3d.com/netlab/): the page and its WebSocket (/netlab/ws), both
# from the lab server on 127.0.0.1:3120. Included from the spacegame site's HTTPS server block (one include line, put
# there by prototypes/netcode-lab/deploy/remote-install.sh); this file is refreshed on every lab deploy.
location = /netlab { return 301 /netlab/; }
location /netlab/ {
    proxy_pass http://127.0.0.1:3120/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
