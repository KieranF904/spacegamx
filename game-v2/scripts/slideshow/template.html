<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slideshow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.idle { cursor: none; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
  img.on { opacity: 1; }
  body.zoomed { cursor: grab; }
  body.dragging { cursor: grabbing; }
  #cap { position: fixed; left: 16px; bottom: 14px; font: 14px system-ui, sans-serif; color: #ccd; background: #000a; padding: 4px 8px; border-radius: 4px; }
  #help { position: fixed; right: 16px; bottom: 14px; font: 13px system-ui, sans-serif; color: #889; background: #000a; padding: 6px 10px; border-radius: 4px; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cap" hidden></div>
<div id="help">Space / → next · ← back · Home start · wheel zoom · drag pan · 0 or double-click reset · F full screen · C caption · H hide this</div>
<script>
// Order: suns and planets (before, then after), the sign-in screens, then the rest.
const SLIDES = [
  'game-sol-sun-limb-before.png', 'game-sol-sun-limb-after.png',
  'game-borealis-sun-limb-before.png', 'game-borealis-sun-limb-after.png',
  'game-cinder-reach-sun-limb-before.png', 'game-cinder-reach-sun-limb-after.png',
  'game-nebula-prime-sun-limb-before.png', 'game-nebula-prime-sun-limb-after.png',
  'borealis-sun-r5-before.png', 'borealis-sun-r5-after.png',
  'cinder-reach-sun-r5-before.png', 'cinder-reach-sun-r5-after.png',
  'planets-ingame-terra-nova-before.png', 'planets-ingame-terra-nova-after.png',
  'planets-ingame-jovan-before.png', 'planets-ingame-jovan-after.png',
  'planets-ingame-lava-before.png', 'planets-ingame-lava-after.png',
  'planets-ingame-brown-dwarf-before.png', 'planets-ingame-brown-dwarf-after.png',
  'prototype-planets-gas-giant-edge-before.png', 'prototype-planets-gas-giant-edge-after.png',
  'prototype-planets-gas-giants.png',
  'login-sun-before.png', 'login-sun-after.png',
  'login-random-body-before.png', 'login-random-body-after.png',
  'login-random-body-sun-after.png', 'login-random-body-terra-nova-after.png', 'login-random-body-terra-nova-moon-after.png',
  'login-random-body-ares-after.png', 'login-random-body-nereid-after.png', 'login-random-body-vesta-after.png',
  'final_citadel_before_after.png',
  'v12_panel.png',
  't-brood.png',
];
const stage = document.getElementById('stage'), cap = document.getElementById('cap'), help = document.getElementById('help');
const imgs = SLIDES.map((src) => { const im = new Image(); im.src = src; im.alt = src; stage.appendChild(im); return im; }); // all preloaded
let i = 0;
// Zoom and pan of the current slide: scale z about the top-left, then shift by (x, y) screen pixels
let z = 1, x = 0, y = 0;
function apply() {
  imgs[i].style.transform = `translate(${x}px, ${y}px) scale(${z})`;
  document.body.classList.toggle('zoomed', z > 1.001);
}
function resetView() { z = 1; x = 0; y = 0; imgs.forEach((im) => { im.style.transform = ''; }); apply(); }
function zoomAt(px, py, factor) {
  const nz = Math.max(1, Math.min(16, z * factor));
  // Keep the point under the cursor where it is
  x = px - ((px - x) / z) * nz; y = py - ((py - y) / z) * nz; z = nz;
  if (z === 1) { x = 0; y = 0; }
  apply();
}
function show(n) {
  i = Math.max(0, Math.min(SLIDES.length - 1, n));
  imgs.forEach((im, k) => im.classList.toggle('on', k === i));
  cap.textContent = `${i + 1} / ${SLIDES.length} · ${SLIDES[i]}`;
  resetView();
}
addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
let drag = null, moved = false;
addEventListener('mousedown', (e) => { if (e.button !== 0) return; drag = { sx: e.clientX, sy: e.clientY, x, y }; moved = false; });
addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  if (moved && z > 1.001) { x = drag.x + dx; y = drag.y + dy; document.body.classList.add('dragging'); apply(); }
});
addEventListener('mouseup', () => { drag = null; document.body.classList.remove('dragging'); });
addEventListener('dblclick', resetView);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(SLIDES.length - 1);
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (e.key === 'c' || e.key === 'C') cap.hidden = !cap.hidden;
  else if (e.key === 'h' || e.key === 'H') help.hidden = !help.hidden;
  else if (e.key === '0') resetView();
  else if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  else if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
});
// A plain click (no drag, not zoomed in) still moves on
let clickTimer = 0;
addEventListener('click', (e) => {
  if (moved || z > 1.001) return;
  clearTimeout(clickTimer);
  if (e.detail === 1) clickTimer = setTimeout(() => show(i + 1), 260); // a double-click cancels it (and resets the view)
  else clearTimeout(clickTimer);
});
let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 1200); });
setTimeout(() => { help.hidden = true; }, 4000);
show(0);
</script>
</body>
</html>
