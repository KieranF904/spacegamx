<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPS Monitor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2f2f2c; --grid: #2a2a27;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--good); } .pill.bad .dot { background: var(--critical); }
  .spacer { flex: 1; }
  .ranges { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ranges button { background: var(--surface); color: var(--text-2); border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
  .ranges button + button { border-left: 1px solid var(--line); }
  .ranges button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
  .alerts { display: grid; gap: 6px; }
  .alert { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
  .alert b { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; min-width: 84px; }
  .alert b::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font: 600 22px/1.2 var(--mono); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--muted); font-size: 13px; }
  .tiles .note { grid-column: 1 / -1; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; position: relative; }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-2); font-size: 12px; margin-bottom: 6px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
  canvas { width: 100%; height: 180px; display: block; }
  .tip { position: absolute; pointer-events: none; background: #000d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 12px/1.45 var(--mono); color: var(--text); white-space: nowrap; display: none; z-index: 2; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
  .tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  td.n, th.n { text-align: right; font-family: var(--mono); }
  td .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 8px; vertical-align: -1px; }
  .state-active { color: var(--text); } .state-other { color: var(--serious); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>VPS Monitor <span>brotherk3d.com</span></h1>
    <span class="pill" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></span>
    <span class="note" id="age"></span>
    <span class="spacer"></span>
    <div class="ranges" role="group" aria-label="Time window">
      <button data-s="120">2 min</button><button data-s="300">5 min</button><button data-s="600" aria-pressed="true">10 min</button>
    </div>
  </header>
  <div class="alerts" id="alerts"></div>
  <section>
    <h2>The box</h2>
    <div class="tiles" id="boxTiles"></div>
  </section>
  <section>
    <h2>The game</h2>
    <div class="tiles" id="gameTiles"></div>
  </section>
  <div class="charts" id="charts"></div>
  <div class="tables">
    <div class="card"><h3>Services</h3><div class="scroll"><table id="svc"></table></div></div>
    <div class="card"><h3>Busiest processes</h3><div class="scroll"><table id="top"></table></div></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
